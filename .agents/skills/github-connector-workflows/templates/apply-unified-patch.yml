# Idempotent remote patch application.
# Replace YOUR_BRANCH and PATCH_* paths before use.
# The patch is forbidden from modifying .github/workflows/**.
name: Apply Connector Unified Patch

on:
  push:
    branches:
      - YOUR_BRANCH
    paths:
      - .agents/connector-triggers/apply-patch.txt

concurrency:
  group: connector-apply-patch-${{ github.ref }}
  cancel-in-progress: false

env:
  LOG_DIR: /tmp/connector-apply-patch-logs
  ACTIVITY_LOG: /tmp/connector-apply-patch-logs/activity.log
  PATCH_DIR: .agents/patches/change
  PATCH_FILE: /tmp/connector-change.patch

jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize persistent log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "event_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "repository=$GITHUB_REPOSITORY"
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$ACTIVITY_LOG"

      - name: Checkout exact event source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify, and apply patch
        id: patch
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a "$ACTIVITY_LOG") 2>&1

          finish() {
            rc=$?
            trap - EXIT
            set +x
            {
              echo "exit_code=$rc"
              echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git status --short --branch || true
              git diff --stat || true
            } | tee -a "$ACTIVITY_LOG"
            exit "$rc"
          }
          trap finish EXIT

          expected_digest_file="$PATCH_DIR/change.patch.sha256"
          expected_blobs_file="$PATCH_DIR/expected-blobs.tsv"

          test -f "$expected_digest_file"
          test -f "$expected_blobs_file"

          mapfile -d '' parts < <(find "$PATCH_DIR" -maxdepth 1 -type f \
            -name 'change.patch.part-*' -print0 | LC_ALL=C sort -z)
          test "${#parts[@]}" -gt 0

          cat "${parts[@]}" > "$PATCH_FILE"

          expected_digest=$(awk '{print $1}' "$expected_digest_file")
          actual_digest=$(sha256sum "$PATCH_FILE" | awk '{print $1}')
          test "$actual_digest" = "$expected_digest"

          if grep -Eq '^(---|\+\+\+) [ab]/\.github/workflows/' "$PATCH_FILE"; then
            echo "Patch modifies .github/workflows/**, which is forbidden." >&2
            exit 2
          fi

          outputs_match() {
            local expected path actual
            while IFS=$'\t' read -r expected path; do
              test -n "$expected" || continue
              test -n "$path" || return 1

              if [[ "$expected" == "DELETE" ]]; then
                [[ ! -e "$path" ]] || return 1
                continue
              fi

              [[ -f "$path" ]] || return 1
              actual=$(git hash-object "$path")
              [[ "$actual" == "$expected" ]] || return 1
            done < "$expected_blobs_file"
          }

          if outputs_match; then
            echo "Every target already matches the expected output blobs; no-op success."
            exit 0
          fi

          set -x
          git apply --check "$PATCH_FILE"
          git apply --index "$PATCH_FILE"
          git diff --check --cached
          set +x

          if ! outputs_match; then
            echo "Post-apply output blob verification failed." >&2
            exit 3
          fi

          if git diff --cached --quiet; then
            echo "No staged changes after verified application."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply verified connector patch"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Always upload detailed workflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connector-apply-patch-logs-${{ github.run_id }}
          path: /tmp/connector-apply-patch-logs
          if-no-files-found: error
          retention-days: 30
          compression-level: 6


  mailbox:
    if: always()
    needs: [apply]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/workflow-mailbox-publisher.yml
    with:
      mailbox_branch: workflow-mailbox
      workflow_key: connector-apply-patch
      source_sha: ${{ github.sha }}
      source_ref: ${{ github.ref }}
      result: ${{ needs.apply.result }}
      summary: Idempotent connector patch application.
